<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Trip Planner | Tourism</title>
  <link rel="stylesheet" href="styles/main.css">
</head>
<body class="trip-page">
  <header class="navbar">
    <div class="logo">
      <img src="scripts/0x0.png" alt="TRIPPER" />
      <h1>TRIPPER</h1>
    </div>
    <nav>
      <a href="index.html">Home</a>
      <a href="map.html">Map</a>
      <a href="guides.html">Guides</a>
      <span id="userSection">
        <a href="login.html">Login</a>
        <a href="signup.html">Signup</a>
      </span>
      <button id="logoutBtn" style="display:none;">Logout</button>
    </nav>
  </header>

  <main class="trip-shell">
    <section class="itinerary-section trip-card">
      <div class="section-header">
        <p class="mini-title">Smart Planning</p>
        <h2>AI Trip Planner</h2>
      </div>

      <form id="tripForm" class="trip-form">
        <input type="text" id="interests" placeholder="Your interests" required>
        <input type="number" id="days" placeholder="Number of days" min="1" required>
        <input type="number" id="baseAmount" placeholder="Base amount (₹)" min="0" required>
        <input type="number" id="budget" placeholder="Total budget (₹)" min="0" required>
        <button type="submit">Generate Itinerary</button>
      </form>

      <div id="loadingSpinner" class="loading-text" style="display:none;">Generating itinerary...</div>
      <div id="itineraryResult" class="itinerary-result"></div>
    </section>
  </main>

  <footer>
    <p>© 2025 Tourism | Powered by AI</p>
  </footer>

  <script src="scripts/main.js"></script>
</body>
</html>
